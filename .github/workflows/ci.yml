# Проверки на каждую выкладку в develop и на pull request.
#
# Инфраструктуры прогон не требует: решение, наборы и очередь проверяются
# тестами в памяти. Сквозные прогоны с шиной -- дело e2e контура.

name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race ./...

      - name: build
        run: go build ./cmd/inspector && go build ./cmd/http && go build ./cmd/probe
