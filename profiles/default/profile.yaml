# Профиль по умолчанию: виджет по заполнению корзин и по просьбе соседей
# (действие challenge в prior). Форма -- docs/inspectors/captcha,
# правила приёма чужих просьб -- docs/inspector-actions.md.
#
# default  — по корзинам, картинка своими силами
# login    — when: always: формы входа и регистрации
# observe  — инспектор всегда allow, в аудит — что решил бы enforce
# _probe   — выводится из default автоматически: when: always, для healthcheck

mode: enforce
path: /waf/captcha
title: "Подтвердите, что вы не робот"

trigger:
  prior:
    # Просьбу о проверке принимаем от кого угодно: ужесточение видно в первую
    # минуту и чинится выключением инспектора. Просьба остаётся просьбой:
    # "когда показывать проверку" решает этот профиль, и правило "here never"
    # её переживает.
    - from: "*"
      accept: [challenge]
    # Инспектор действий -- доверенный отправитель контура: принимаем все его
    # глаголы, включая изменения корзин со знаком.
    - from: action
      accept: ["*"]

# Корзины: общий счёт субъектов на контурном Redis
# (docs/inspectors/captcha/buckets.md). Наполняют соседи просьбами note,
# проценты -- от ёмкости. Личная корзина сессии заменяет прежний reverify.
buckets:
  ip:        { max: 100,  loss: 1,   captcha_at: 60, ban_at: 90 }
  sess:      { max: 100,  loss: 1,   captcha_at: 60 }
  asn_net:   { max: 300,  loss: 1,   captcha_at: 60 }
  asn_router: { max: 1000, loss: 0.5, captcha_at: 60 }

gate:
  redirect_methods: [GET, HEAD]
  redirect_status: 303
  deny_response: captcha_required
  html_only: true

provider:
  kind: image
  length: 5

challenge:
  cookie: waf_cap
  ttl: 5m

clearance:
  cookie: waf_clr
  id_cookie: waf_cid
  ttl: 24h
  bind: [subnet, ua]
  subnet: { v4: 24, v6: 64 }

fingerprint:
  collect: true
  canvas: false
  farm_at: 50
  window: 1h

limits:
  issue_per_subnet: 30/m
  verify_per_subnet: 60/m
  pending_max: 200000
  provider_budget: 50/s

upstream:
  header: X-WAF-Captcha

roster:
  store: redis
  prefix: "cap:"
  revoke_refresh: 2s
