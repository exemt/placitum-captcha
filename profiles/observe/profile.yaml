# Observe: the inspector always answers allow and records in the audit what enforce would decide
# (engine.would, engine.trigger). Use it to tune bucket thresholds on live traffic without
# locking people behind the widget. No path is needed: there is no redirect.

mode: observe

trigger:
  when: buckets

gate:
  deny_response: captcha_required

provider:
  kind: image
  length: 5

challenge:
  cookie: waf_cap
  ttl: 5m

clearance:
  cookie: waf_clr
  id_cookie: waf_cid
  ttl: 24h

limits:
  issue_per_subnet: 30/m
  verify_per_subnet: 60/m
  pending_max: 200000
  provider_budget: 50/s

upstream:
  header: X-WAF-Captcha

roster:
  store: redis
  prefix: "cap:"
  revoke_refresh: 2s
