# Local inspector queue.
#
# queue_max also sizes the NATS client buffer: queue_max + workers + 2. When that buffer overflows,
# the client drops messages silently and the module waits out waf_deadline, so size it for the
# arrival rate times a scheduling pause: 256 is about 25 ms at 10 000 messages per second.
#
# queue_max     requests waiting for evaluation, not counting those in progress
# queue_full    drop: answer error CAPTCHA_QUEUE_LIMIT at once
#               wait: wait for room until deadline_ms, otherwise CAPTCHA_DEADLINE_EXCEEDED
# queue_expand  ask: ask the controller to expand (not sent yet)
#               off: do not ask
#
# A dropped request answers verdict: error; the route decides its fate
# (waf_exception <phase> inspector pass|deny).

queue_max     256;
queue_full    drop;
queue_expand  off;

# Redis addresses, the same form as in agent.conf; REDIS_URL and REDIS_INTERNAL_URL override them.
#   url       exchange: request headers (the clearance cookie)
#   internal  internal Redis: buckets, roster and clearance mirror, shared with captcha-http
redis {
    url       redis://redis:6379;
    internal  redis://redis-internal:6379;
}
