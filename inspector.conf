# Локальная очередь инспектора. Ответ на каждом пути, решение по причине —
# у модуля.
#
# ВАЖНО: queue_max задаёт ДВА размера. Свою очередь — и буфер подписки
# клиента NATS, он считается как queue_max + workers + 2. Буфер клиента НЕ
# безлимитен (так здесь было написано раньше, и это неправда): переполнив
# его, библиотека режет сообщения молча, модуль ждёт весь waf_deadline и
# отвечает отказом, а счётчика этих потерь нет ни в пульсе, ни в журнале.
#
# Поэтому число выбирается по буферу, а не по очереди. Буфер обязан покрыть
# темп прихода, умноженный на паузу, которую горутина-диспетчер может
# пропустить: сборка мусора, запись в stdout соседом, перепланирование.
# При 10 000 сообщений в секунду 256 штук — это ~25 мс терпения; прежние 16
# давали 2 мс и теряли сообщения на обычном дрожании (замер 09.09.2026:
# 33 потерянных на 75 810 отправленных, с 256 — ноль).
#
# queue_max     сколько запросов ждут оценки, не считая тех, что уже в работе
# queue_full    drop — сразу error + CAPTCHA_QUEUE_LIMIT
#               wait — ждать место до истечения deadline_ms, иначе CAPTCHA_DEADLINE_EXCEEDED
# queue_expand  ask — попросить контроллер расширить (пока не отправляется)
#               off — не просить
#
# Сброшенный запрос отвечает `verdict: error` — «проверить не смог»: судьбу
# такого запроса называет маршрут (waf_exception <фаза> inspector pass|deny),
# а инспектор больше не выбирает за него между пропуском и отказом.

queue_max     256;
queue_full    drop;
queue_expand  off;

# Адреса Redis -- одна форма на весь контур, так же блок пишется в agent.conf:
#   url      -- общий обменник: тела, заголовки, строка запроса;
#   internal -- внутренний Redis: всё остальное.
# Окружение перекрывает: REDIS_URL -- url, REDIS_INTERNAL_URL -- internal.
# Здесь: url -- заголовки запроса (cookie клиренса), internal -- корзины,
# роастер и зеркало клиренсов; общий с captcha-http.
#
# Пока закомментировано: образ на стенде старше блока и падает на нём, адреса
# едут окружением из compose. Раскомментировать вместе с раскаткой образа.
redis {
    url       redis://redis:6379;
    internal  redis://redis-internal:6379;
}
